name: Qualify and publish Core update channel
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: synora-core-channel
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'devid791/Synora' && github.ref == 'refs/heads/main' && vars.CORE_CHANNEL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.latest.outputs.version }}
    steps:
      - id: latest
        name: Verify native workers are online and discover the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const workers = await fetch('https://api.github.com/repos/devid791/Synora/actions/runners?per_page=100', {
            headers: {Authorization: 'Bearer ' + process.env.GH_TOKEN},
            signal: AbortSignal.timeout(15000), redirect: 'error'
          });
          if (!workers.ok) throw Error('Runner readiness HTTP ' + workers.status);
          const data = await workers.json();
          for (const label of ['synora-qa-linux-x64', 'synora-qa-macos-arm64', 'synora-qa-windows-x64']) {
            if (!data.runners.some(r => r.status === 'online' && r.labels.some(l => l.name === label)))
              throw Error(label + ' is offline; no update is authorized. Next scheduled run will retry.');
          }
          const r = await fetch('https://api.github.com/repos/openai/codex/releases/latest', {redirect:'error',signal:AbortSignal.timeout(15000)});
          if (!r.ok) throw Error('Release discovery HTTP ' + r.status);
          const v = await r.json();
          if(v.draft || v.prerelease || !/^rust-v\d+\.\d+\.\d+$/.test(v.tag_name)) throw Error('Not a stable release');
          appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + v.tag_name.slice(6) + '\n');
          JS
  qualify:
    needs: discover
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: linux
            runner: synora-qa-linux-x64
            shell: bash
          - os: mac
            runner: synora-qa-macos-arm64
            shell: bash
          - os: win
            runner: synora-qa-windows-x64
            shell: powershell
    runs-on: [self-hosted, '${{ matrix.runner }}']
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node scripts/core-channel-worktree.mjs
        shell: ${{ matrix.shell }}
      - name: Verify candidate and build native components
        shell: ${{ matrix.shell }}
        env:
          CORE_VERSION: ${{ needs.discover.outputs.version }}
        run: node scripts/run-core-channel-job.mjs prepare
      - name: Package isolated candidate
        shell: ${{ matrix.shell }}
        run: node scripts/run-core-channel-job.mjs package
      - name: Real native qualification
        shell: ${{ matrix.shell }}
        run: node scripts/run-core-channel-job.mjs qualify
      - name: Retain measured reports (a failed or missing gate cannot sign)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-${{ matrix.os }}
          path: ${{ env.CORE_QA_WORKTREE }}/out/core-channel-qualification/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this run's disposable source worktree
        if: always() && env.CORE_QA_WORKTREE != ''
        shell: ${{ matrix.shell }}
        run: node scripts/core-channel-worktree.mjs cleanup
  publish:
    needs: [discover, qualify]
    runs-on: ubuntu-24.04
    environment: core-channel-publisher
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: core-*
          path: out/core-channel-reports
      - run: npm ci --ignore-scripts
      - name: Verify all evidence, sign, and publish through restricted SSH command
        env:
          SYNORA_CHANNEL_SIGNING_KEY: ${{ secrets.CORE_CHANNEL_SIGNING_KEY }}
          SYNORA_CHANNEL_DEPLOY_KEY: ${{ secrets.CORE_CHANNEL_DEPLOY_KEY }}
          SYNORA_CHANNEL_KNOWN_HOSTS: ${{ secrets.CORE_CHANNEL_KNOWN_HOSTS }}
          SYNORA_CHANNEL_DEPLOY_HOST: ${{ vars.CORE_CHANNEL_DEPLOY_HOST }}
          SYNORA_CHANNEL_DEPLOY_USER: ${{ vars.CORE_CHANNEL_DEPLOY_USER }}
        run: node --import tsx scripts/publish-core-channel.ts
