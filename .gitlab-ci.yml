include:
  - local: .gitlab/app-release.yml
# Core: central compatibility + mandatory local activation, no personal Macs.
# Full native app QA is a separate, explicitly selected lane.
workflow:
  rules:
    - if: '$CI_SERVER_HOST != "gitlab.synapsecorp.org" || $CI_PROJECT_PATH != "davide/synora" || $CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - src/**/*
        - public/**/*
        - native/**/*
        - package.json
        - package-lock.json
        - scripts/build*.mjs
        - scripts/prepare*.mjs
        - scripts/package*.mjs
        - scripts/after-pack.mjs
        - scripts/brand.mjs
        - scripts/download-core.mjs
        - docs/core-runtime*.json
        - releases/*.md
      variables:
        APP_BUILD: "1"
    - if: '$APP_BUILD == "1" || $APP_RELEASE == "1"'
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_PIPELINE_SOURCE != "web" && $CI_PIPELINE_SOURCE != "api"'
      when: never
    - if: '$CORE_PLATFORM == "linux"'
      variables:
        CORE_RUNNER: synora-gitlab-linux-x64
        CORE_TARGET: x86_64-unknown-linux-musl
    - if: '$CORE_PLATFORM == "mac"'
      variables:
        CORE_RUNNER: synora-gitlab-macos-arm64
        CORE_TARGET: aarch64-apple-darwin
    - if: '$CORE_PLATFORM == "win"'
      variables:
        CORE_RUNNER: synora-gitlab-windows-x64
        CORE_TARGET: x86_64-pc-windows-msvc
    - when: never

stages: [discover, qualify, publish]
default:
  interruptible: false
variables:
  GIT_DEPTH: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

discover:
  stage: discover
  rules:
    - if: '$APP_BUILD == "1" || $APP_RELEASE == "1"'
      when: never
    - when: on_success
  tags: [synora-gitlab-publisher]
  timeout: 5m
  script:
    - node scripts/gitlab-core-discover.mjs
  artifacts:
    reports:
      dotenv: core-candidate.env
    expire_in: 1 day

qualify-core:
  stage: qualify
  needs: [discover]
  tags: [synora-gitlab-linux-x64]
  resource_group: core-server-$CORE_PLATFORM
  timeout: 30m
  rules:
    - if: '$APP_BUILD == "1" || $APP_RELEASE == "1"'
      when: never
    - if: '$CORE_FULL_APP_QA == "1"'
      when: never
    - when: on_success
  script:
    - node scripts/gitlab-core-central.mjs
  artifacts:
    when: always
    access: maintainer
    paths: [out/gitlab-core/]
    expire_in: 14 days

qualify-app-native:
  stage: qualify
  needs: [discover]
  tags: ['$CORE_RUNNER']
  resource_group: app-native-$CORE_PLATFORM
  timeout: 90m
  rules:
    - if: '$APP_BUILD == "1" || $APP_RELEASE == "1"'
      when: never
    - if: '$CORE_FULL_APP_QA == "1"'
  script:
    - node scripts/gitlab-core-qa.mjs
  artifacts:
    when: always
    access: maintainer
    paths: [out/gitlab-core/]
    expire_in: 14 days

publish:
  stage: publish
  needs:
    - discover
    - qualify-core
  tags: [synora-gitlab-publisher]
  rules:
    - if: '$APP_BUILD == "1" || $APP_RELEASE == "1"'
      when: never
    - if: '$CORE_FULL_APP_QA == "1"'
      when: never
    - when: on_success
  # Lock ONLY this short merge/sign/write operation, not native qualification.
  resource_group: core-channel-publish
  environment:
    name: core-channel-publisher
  timeout: 10m
  script:
    - npm ci --ignore-scripts
    - node --import tsx scripts/publish-core-channel.ts out/gitlab-core/out/core-central/qualification.json
